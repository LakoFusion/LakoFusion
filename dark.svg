<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320" role="img" aria-label="LakoFusion Terminal Banner">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Glow Spots -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="neon-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-opacity="0.3" stroke-width="0.8" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .brand { font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: 2px; }
      .subtext { font-size: 13px; fill: #00f2fe; letter-spacing: 4px; font-weight: 600; }
      .meta { font-size: 11px; fill: #64748b; letter-spacing: 1px; }
      .hud-val { font-size: 12px; fill: #94a3b8; font-weight: 500; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1180" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="280" cy="160" r="260" fill="url(#cyan-glow)" />
  <circle cx="900" cy="160" r="280" fill="url(#purple-glow)" />
  <rect width="1180" height="320" rx="16" fill="url(#cyber-grid)" />

  <!-- Top Terminal Bar -->
  <g transform="translate(24, 20)">
    <circle cx="10" cy="10" r="5" fill="#ef4444" />
    <circle cx="26" cy="10" r="5" fill="#f59e0b" />
    <circle cx="42" cy="10" r="5" fill="#10b981" />
    <text x="68" y="14" class="mono meta">SESSION_ID // LAKO-DAEMON-PROD</text>

    <!-- Status Pill -->
    <rect x="990" y="0" width="140" height="22" rx="11" fill="#070d19" stroke="#1e293b" />
    <circle cx="1006" cy="11" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="1018" y="15" class="mono" font-size="10" fill="#10b981" font-weight="600">RUNTIME : ONLINE</text>
  </g>

  <!-- Decorative Separator Line -->
  <line x1="24" y1="52" x2="1156" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== LEFT DECORATION: BRAND & RUNTIME PULSE ==================== -->
  <g transform="translate(60, 110)">
    <!-- Terminal Command Line -->
    <text x="0" y="0" class="mono subtext">&gt; SYSTEM.INITIALIZE // RUNNING</text>
    
    <!-- Big Title -->
    <text x="0" y="48" class="mono brand">LakoFusion
      <tspan fill="#00f2fe">.</tspan>
    </text>

    <!-- Blinking Cursor Accent -->
    <rect x="340" y="14" width="12" height="36" fill="#00f2fe">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>

    <!-- Sub-label -->
    <text x="0" y="80" class="mono meta">DAEMON WORKFLOWS &amp; DISTRIBUTED PIPELINES</text>

    <!-- Mini Pulse Graph Line -->
    <g transform="translate(0, 110)">
      <path d="M 0 10 L 80 10 L 95 -6 L 110 24 L 125 4 L 140 10 L 320 10" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="400;0" dur="3s" repeatCount="indefinite" />
      </path>
      <circle cx="110" cy="24" r="3" fill="#10b981">
        <animate attributeName="r" values="3;5;3" dur="1s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- ==================== CENTER DECORATIVE SEPARATOR ==================== -->
  <line x1="560" y1="80" x2="560" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== RIGHT DECORATION: AUDIO/NETWORK SPECTRUM & HUD ==================== -->
  <g transform="translate(620, 95)">
    <!-- HUD Header -->
    <text x="0" y="10" class="mono meta">ACTIVITY_TELEMETRY // IO_SIGNALS</text>
    
    <!-- Audio/Network Data Visualizer Bars -->
    <g transform="translate(0, 30)">
      <!-- 12 Animated Spectrum Bars -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="8" height="50" rx="3" fill="#00f2fe">
          <animate attributeName="height" values="20;60;15;50;20" dur="1.8s" repeatCount="indefinite" />
          <animate attributeName="y" values="30;-10;35;0;30" dur="1.8s" repeatCount="indefinite" />
        </rect>
        <rect x="18" y="0" width="8" height="35" rx="3" fill="#38bdf8">
          <animate attributeName="height" values="45;20;65;30;45" dur="1.4s" repeatCount="indefinite" />
          <animate attributeName="y" values="5;30;-15;20;5" dur="1.4s" repeatCount="indefinite" />
        </rect>
        <rect x="36" y="0" width="8" height="60" rx="3" fill="#6366f1">
          <animate attributeName="height" values="60;35;20;70;60" dur="2s" repeatCount="indefinite" />
          <animate attributeName="y" values="-10;15;30;-20;-10" dur="2s" repeatCount="indefinite" />
        </rect>
        <rect x="54" y="0" width="8" height="40" rx="3" fill="#818cf8">
          <animate attributeName="height" values="30;65;40;20;30" dur="1.6s" repeatCount="indefinite" />
          <animate attributeName="y" values="20;-15;10;30;20" dur="1.6s" repeatCount="indefinite" />
        </rect>
        <rect x="72" y="0" width="8" height="25" rx="3" fill="#a855f7">
          <animate attributeName="height" values="15;45;70;25;15" dur="1.5s" repeatCount="indefinite" />
          <animate attributeName="y" values="35;5;-20;25;35" dur="1.5s" repeatCount="indefinite" />
        </rect>
        <rect x="90" y="0" width="8" height="55" rx="3" fill="#c084fc">
          <animate attributeName="height" values="50;15;40;65;50" dur="1.9s" repeatCount="indefinite" />
          <animate attributeName="y" values="0;35;10;-15;0" dur="1.9s" repeatCount="indefinite" />
        </rect>
        <rect x="108" y="0" width="8" height="45" rx="3" fill="#00f2fe">
          <animate attributeName="height" values="40;70;25;50;40" dur="1.7s" repeatCount="indefinite" />
          <animate attributeName="y" values="10;-20;25;0;10" dur="1.7s" repeatCount="indefinite" />
        </rect>
        <rect x="126" y="0" width="8" height="30" rx="3" fill="#38bdf8">
          <animate attributeName="height" values="25;50;75;30;25" dur="2.1s" repeatCount="indefinite" />
          <animate attributeName="y" values="25;0;-25;20;25" dur="2.1s" repeatCount="indefinite" />
        </rect>
      </g>

      <!-- Right HUD Panel Grid -->
      <g transform="translate(190, 0)">
        <rect width="280" height="70" rx="8" fill="#050a14" stroke="#1e293b" />
        <g transform="translate(18, 22)">
          <text x="0" y="0" class="mono meta">PACKET ENGINE</text>
          <text x="140" y="0" class="mono hud-val" fill="#10b981">READY [200]</text>
          <text x="0" y="24" class="mono meta">EXEC_LATENCY</text>
          <text x="140" y="24" class="mono hud-val">&lt; 38 ms</text>
        </g>
      </g>
    </g>

    <!-- Ambient Glowing Gradient Bar at bottom of panel -->
    <rect x="0" y="145" width="470" height="3" rx="1.5" fill="url(#neon-line)" />
    
    <g transform="translate(0, 168)">
      <text x="0" y="0" class="mono meta">0x7F_ASYNC_THREAD</text>
      <text x="210" y="0" class="mono meta">STATUS: HEALTHY</text>
      <text x="400" y="0" class="mono meta" fill="#10b981">● 99.9%</text>
    </g>
  </g>
</svg>
