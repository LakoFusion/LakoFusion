<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320" role="img" aria-label="LakoFusion - Roblox &amp; Discord Automation Specialist">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#050b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Neon Glow Accents -->
    <radialGradient id="cyan-glow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purple-glow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyber-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-opacity="0.28" stroke-width="0.8" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .brand { font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: 1.5px; }
      .tag { font-size: 13px; fill: #00f2fe; font-weight: 700; letter-spacing: 2px; }
      .about-title { font-weight: 700; font-size: 18px; fill: #38bdf8; letter-spacing: 0.5px; }
      .about-body { font-size: 14.5px; fill: #e2e8f0; font-weight: 500; }
      .about-hl { fill: #10b981; font-weight: 600; }
      .meta { font-size: 11px; fill: #64748b; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1180" height="320" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.2" />
  <circle cx="250" cy="160" r="280" fill="url(#cyan-glow)" />
  <circle cx="950" cy="160" r="280" fill="url(#purple-glow)" />
  <rect width="1180" height="320" rx="16" fill="url(#cyber-grid)" />

  <!-- Top Terminal Bar -->
  <g transform="translate(24, 20)">
    <circle cx="10" cy="10" r="5" fill="#ef4444" />
    <circle cx="26" cy="10" r="5" fill="#f59e0b" />
    <circle cx="42" cy="10" r="5" fill="#10b981" />
    <text x="68" y="14" class="mono meta">LAKOFUSION // CORE_INTERFACE</text>

    <!-- Status Active -->
    <rect x="1000" y="0" width="130" height="22" rx="11" fill="#070d19" stroke="#1e293b" />
    <circle cx="1016" cy="11" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="1028" y="15" class="mono" font-size="10" fill="#10b981" font-weight="600">ACTIVE</text>
  </g>

  <!-- Divider Line -->
  <line x1="24" y1="52" x2="1156" y2="52" stroke="#1e293b" stroke-width="1" />

  <!-- ==================== LEFT AREA: BRAND & ABOUT ME ==================== -->
  <g transform="translate(56, 95)">
    <!-- Brand Name -->
    <text x="0" y="0" class="mono brand">LakoFusion<tspan fill="#00f2fe">.</tspan></text>
    <text x="245" y="-3" class="mono tag">[PROFILE // ABOUT]</text>

    <!-- Integrated About Me Text -->
    <g transform="translate(0, 42)">
      <text x="0" y="0" class="mono about-title">&gt; Automation Developer &amp; Trick Hunter</text>
      
      <text x="0" y="32" class="mono about-body">
        Chuyên xây dựng <tspan class="about-hl">Roblox Tools</tspan>, tối ưu <tspan class="about-hl">Discord Automation</tspan> &amp; Bots.
      </text>
      <text x="0" y="60" class="mono about-body">
        Nghiên cứu, thu thập và khai thác <tspan fill="#00f2fe" font-weight="600">Tricks / Automated Scripts</tspan> hiệu quả cao.
      </text>
    </g>

    <!-- Mini Pulse Signal Line -->
    <g transform="translate(0, 160)">
      <path d="M 0 10 L 120 10 L 135 -4 L 150 20 L 165 4 L 180 10 L 460 10" fill="none" stroke="#00f2fe" stroke-width="1.8" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="500;0" dur="3s" repeatCount="indefinite" />
      </path>
      <circle cx="150" cy="20" r="3" fill="#10b981">
        <animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Center Separator -->
  <line x1="820" y1="78" x2="820" y2="285" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />

  <!-- ==================== RIGHT AREA: CHỈ GIỮ LẠI XUNG NHỊP ==================== -->
  <g transform="translate(865, 125)">
    <!-- 10 Animated Pulse Bars (Giữ nguyên xung nhịp mượt mà) -->
    <rect x="0" y="0" width="14" height="60" rx="4" fill="#00f2fe">
      <animate attributeName="height" values="25;75;20;60;25" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="35;-15;40;0;35" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="22" y="0" width="14" height="45" rx="4" fill="#38bdf8">
      <animate attributeName="height" values="55;25;85;35;55" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="5;35;-25;25;5" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="44" y="0" width="14" height="75" rx="4" fill="#6366f1">
      <animate attributeName="height" values="75;40;25;90;75" dur="2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-15;20;35;-30;-15" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect x="66" y="0" width="14" height="50" rx="4" fill="#818cf8">
      <animate attributeName="height" values="40;80;50;25;40" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;-20;10;35;20" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="88" y="0" width="14" height="35" rx="4" fill="#a855f7">
      <animate attributeName="height" values="20;55;90;30;20" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="40;5;-30;30;40" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="110" y="0" width="14" height="70" rx="4" fill="#c084fc">
      <animate attributeName="height" values="65;20;50;85;65" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-5;40;10;-25;-5" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="0" width="14" height="55" rx="4" fill="#00f2fe">
      <animate attributeName="height" values="50;85;30;60;50" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;-25;30;0;10" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <rect x="154" y="0" width="14" height="40" rx="4" fill="#38bdf8">
      <animate attributeName="height" values="30;60;95;40;30" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="30;0;-35;20;30" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="176" y="0" width="14" height="65" rx="4" fill="#10b981">
      <animate attributeName="height" values="60;25;70;30;60" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="0;35;-10;30;0" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="198" y="0" width="14" height="35" rx="4" fill="#00f2fe">
      <animate attributeName="height" values="25;70;40;80;25" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="35;-10;20;-20;35" dur="1.6s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
