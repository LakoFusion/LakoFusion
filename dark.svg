<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610" role="img" aria-label="Lê Duy Nhật - Python Developer and Automation Specialist">
  <defs>
    <!-- Background Dark Gradient -->
    <radialGradient id="bg-grad-dark" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0b1728" />
      <stop offset="50%" stop-color="#060c16" />
      <stop offset="100%" stop-color="#02050b" />
    </radialGradient>

    <!-- Ambient Neon Accents -->
    <radialGradient id="cyan-glow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet-glow" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="panel-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.50" />
      <stop offset="100%" stop-color="#0a101d" stop-opacity="0.40" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Grid / Scanline -->
    <pattern id="matrix-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-opacity="0.08" stroke-width="0.8" />
    </pattern>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .title { font-weight: 700; fill: #f8fafc; letter-spacing: -0.5px; }
      .headline { fill: #38bdf8; font-weight: 600; }
      .muted { fill: #64748b; font-size: 13px; }
      .lbl { fill: #00f2fe; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
      .val { fill: #e2e8f0; font-size: 13px; }
      .pill-box { fill: #090f1d; stroke: #1e293b; stroke-width: 1; rx: 6px; }
      .pill-text { fill: #94a3b8; font-size: 11px; font-weight: 500; }
      .panel-header { fill: #38bdf8; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1180" height="610" rx="20" fill="url(#bg-grad-dark)" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="200" cy="150" r="320" fill="url(#cyan-glow)" />
  <circle cx="950" cy="460" r="350" fill="url(#violet-glow)" />
  <rect width="1180" height="610" rx="20" fill="url(#matrix-grid)" />

  <!-- Top Terminal Bar -->
  <g transform="translate(32, 22)">
    <circle cx="10" cy="10" r="5" fill="#ef4444" />
    <circle cx="26" cy="10" r="5" fill="#f59e0b" />
    <circle cx="42" cy="10" r="5" fill="#10b981" />
    <text x="68" y="14" class="mono muted" font-size="12">lako@core-terminal: ~ /workspace/profile (master)</text>
    <rect x="980" y="0" width="136" height="22" rx="11" fill="#090f1d" stroke="#1e293b" />
    <circle cx="994" cy="11" r="3.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="1006" y="15" class="mono" font-size="10" fill="#10b981" font-weight="600">STABLE // ONLINE</text>
  </g>

  <!-- ==================== LEFT PANEL: IDENTITY & RUNTIME (48%) ==================== -->
  <g transform="translate(32, 60)">
    <rect width="536" height="518" rx="14" fill="url(#panel-card)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Panel Header -->
    <g transform="translate(26, 24)">
      <path d="M 0 0 L 14 0" stroke="#00f2fe" stroke-width="2.5" />
      <text x="22" y="4" class="mono panel-header">SYSTEM.SPEC // IDENTITY &amp; CORE</text>
      <line x1="0" y1="14" x2="484" y2="14" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- Identity & Animated Role -->
    <g transform="translate(26, 74)">
      <text x="0" y="0" class="mono title" font-size="28">Lê Duy Nhật</text>
      <text x="210" y="-3" class="mono muted" font-size="15">(@lakofusion)</text>
      
      <!-- Role Switcher -->
      <g transform="translate(0, 26)">
        <text class="mono headline" font-size="15">&gt; Python Developer &amp; Automation Engineer
          <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="7s" repeatCount="indefinite" />
        </text>
        <text class="mono headline" font-size="15">&gt; Backend Utilities &amp; Systems Builder
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="7s" repeatCount="indefinite" />
        </text>
        <line x1="392" y1="-14" x2="392" y2="2" stroke="#00f2fe" stroke-width="2">
          <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" />
        </line>
      </g>
      <text x="0" y="56" class="mono muted" font-size="12.5">Building automated workflows, scripts, and robust backend utilities.</text>
    </g>

    <line x1="26" y1="168" x2="510" y2="168" stroke="#1e293b" stroke-width="1" />

    <!-- Runtime Attributes -->
    <g transform="translate(26, 196)">
      <text x="0" y="0" class="mono lbl">&gt; CORE FOCUS</text>
      <text x="135" y="0" class="mono val">Automation &amp; System Daemons</text>

      <text x="0" y="32" class="mono lbl">&gt; SPECIALTY</text>
      <text x="135" y="32" class="mono val">Backend Services &amp; RESTful APIs</text>

      <text x="0" y="64" class="mono lbl">&gt; ARCHITECTURE</text>
      <text x="135" y="64" class="mono val">Microservices, Event-driven, Scraping</text>

      <text x="0" y="96" class="mono lbl">&gt; ENVIRONMENT</text>
      <text x="135" y="96" class="mono val" fill="#10b981">Linux / Containerized Docker / Cloud</text>
    </g>

    <line x1="26" y1="324" x2="510" y2="324" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Command & Endpoints -->
    <g transform="translate(26, 344)">
      <rect width="484" height="144" rx="10" fill="#060c16" fill-opacity="0.85" stroke="#1e293b" />
      
      <g transform="translate(18, 22)">
        <text x="0" y="0" class="mono" font-size="12" fill="#10b981">~/network $</text>
        <text x="105" y="0" class="mono" font-size="12" fill="#e2e8f0">netstat --social-channels</text>

        <text x="0" y="28" class="mono lbl" font-size="11">&gt; DISCORD</text>
        <text x="105" y="28" class="mono val" font-size="12">discord.gg/rxw8Hwk3qA</text>

        <text x="0" y="52" class="mono lbl" font-size="11">&gt; YOUTUBE</text>
        <text x="105" y="52" class="mono val" font-size="12">@lakofusion2010</text>

        <text x="0" y="76" class="mono lbl" font-size="11">&gt; TIKTOK</text>
        <text x="105" y="76" class="mono val" font-size="12">@lakofusion</text>

        <text x="0" y="100" class="mono muted" font-size="11">&gt; STATUS: <tspan fill="#10b981">Ready for open collaborations &amp; scripts</tspan></text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT PANEL: STACK & TELEMETRY (48%) ==================== -->
  <g transform="translate(584, 60)">
    <rect width="564" height="518" rx="14" fill="url(#panel-card)" stroke="#1e293b" stroke-width="1.2" />

    <!-- Panel Header -->
    <g transform="translate(26, 24)">
      <path d="M 0 0 L 14 0" stroke="#00f2fe" stroke-width="2.5" />
      <text x="22" y="4" class="mono panel-header">ENGINEERING.STACK // DEPLOYED TECH MATRIX</text>
      <line x1="0" y1="14" x2="512" y2="14" stroke="#1e293b" stroke-width="1" />
    </g>

    <!-- Tech Categories & Badges -->
    <g transform="translate(26, 68)">
      
      <!-- Category 1: Languages -->
      <text x="0" y="0" class="mono lbl">[01] CORE LANGUAGES</text>
      <g transform="translate(0, 12)">
        <rect x="0" y="0" width="85" height="26" class="pill-box" />
        <circle cx="12" cy="13" r="3" fill="#38bdf8" />
        <text x="24" y="17" class="mono pill-text">Python</text>

        <rect x="95" y="0" width="65" height="26" class="pill-box" />
        <circle cx="107" cy="13" r="3" fill="#00add8" />
        <text x="119" y="17" class="mono pill-text">Go</text>

        <rect x="170" y="0" width="65" height="26" class="pill-box" />
        <circle cx="182" cy="13" r="3" fill="#5865f2" />
        <text x="194" y="17" class="mono pill-text">Lua</text>
      </g>

      <!-- Category 2: Backend & Realtime -->
      <text x="0" y="68" class="mono lbl">[02] BACKEND &amp; REALTIME</text>
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="90" height="26" class="pill-box" />
        <circle cx="12" cy="13" r="3" fill="#059669" />
        <text x="24" y="17" class="mono pill-text">FastAPI</text>

        <rect x="100" y="0" width="75" height="26" class="pill-box" />
        <circle cx="112" cy="13" r="3" fill="#f8fafc" />
        <text x="124" y="17" class="mono pill-text">Flask</text>

        <rect x="185" y="0" width="95" height="26" class="pill-box" />
        <circle cx="197" cy="13" r="3" fill="#00f2fe" />
        <text x="209" y="17" class="mono pill-text">Socket.io</text>
      </g>

      <!-- Category 3: Automation & Processing -->
      <text x="0" y="136" class="mono lbl">[03] AUTOMATION &amp; COMPUTER VISION</text>
      <g transform="translate(0, 148)">
        <rect x="0" y="0" width="95" height="26" class="pill-box" />
        <circle cx="12" cy="13" r="3" fill="#10b981" />
        <text x="24" y="17" class="mono pill-text">Selenium</text>

        <rect x="105" y="0" width="90" height="26" class="pill-box" />
        <circle cx="117" cy="13" r="3" fill="#a855f7" />
        <text x="129" y="17" class="mono pill-text">OpenCV</text>

        <rect x="205" y="0" width="85" height="26" class="pill-box" />
        <circle cx="217" cy="13" r="3" fill="#38bdf8" />
        <text x="229" y="17" class="mono pill-text">NumPy</text>
      </g>

      <!-- Category 4: DevOps & Platform -->
      <text x="0" y="204" class="mono lbl">[04] PLATFORMS &amp; DEPLOYMENT</text>
      <g transform="translate(0, 216)">
        <rect x="0" y="0" width="85" height="26" class="pill-box" />
        <circle cx="12" cy="13" r="3" fill="#2496ed" />
        <text x="24" y="17" class="mono pill-text">Docker</text>

        <rect x="95" y="0" width="85" height="26" class="pill-box" />
        <circle cx="107" cy="13" r="3" fill="#f8fafc" />
        <text x="119" y="17" class="mono pill-text">Vercel</text>

        <rect x="190" y="0" width="85" height="26" class="pill-box" />
        <circle cx="202" cy="13" r="3" fill="#00c7b7" />
        <text x="214" y="17" class="mono pill-text">Netlify</text>

        <rect x="285" y="0" width="85" height="26" class="pill-box" />
        <circle cx="297" cy="13" r="3" fill="#e2e8f0" />
        <text x="309" y="17" class="mono pill-text">GitHub</text>
      </g>

      <!-- Category 5: Design & Prototyping -->
      <text x="0" y="272" class="mono lbl">[05] DESIGN &amp; INTERFACE</text>
      <g transform="translate(0, 284)">
        <rect x="0" y="0" width="80" height="26" class="pill-box" />
        <circle cx="12" cy="13" r="3" fill="#f24e1e" />
        <text x="24" y="17" class="mono pill-text">Figma</text>

        <rect x="90" y="0" width="80" height="26" class="pill-box" />
        <circle cx="102" cy="13" r="3" fill="#00c4cc" />
        <text x="114" y="17" class="mono pill-text">Canva</text>
      </g>
    </g>

    <!-- Bottom Telemetry Block -->
    <g transform="translate(26, 412)">
      <rect width="512" height="76" rx="10" fill="#060c16" fill-opacity="0.85" stroke="#1e293b" />
      <text x="18" y="26" class="mono panel-header">SYSTEM.METRICS // ENGINE STATUS</text>
      
      <!-- Progress Bar 1 -->
      <g transform="translate(18, 42)">
        <text x="0" y="0" class="mono muted" font-size="11">Automation Workflows</text>
        <rect x="170" y="-8" width="310" height="8" rx="4" fill="#0f172a" />
        <rect x="170" y="-8" width="295" height="8" rx="4" fill="url(#accent-cyan)" />
      </g>

      <!-- Progress Bar 2 -->
      <g transform="translate(18, 62)">
        <text x="0" y="0" class="mono muted" font-size="11">API Service Integrity</text>
        <rect x="170" y="-8" width="310" height="8" rx="4" fill="#0f172a" />
        <rect x="170" y="-8" width="302" height="8" rx="4" fill="#10b981" />
      </g>
    </g>
  </g>
</svg>
